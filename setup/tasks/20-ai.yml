---
# VS Code and ChatGPT desktop (official apt repos — no snaps), plus the
# Claude Code and Codex CLIs (official standalone installers, per-user).

- name: VS Code signing key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: "{{ keyring_dir }}/vscode.asc"
    mode: "0644"

- name: VS Code apt repo
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: https://packages.microsoft.com/repos/code
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: "{{ keyring_dir }}/vscode.asc"

- name: VS Code
  ansible.builtin.apt:
    name: code

- name: ChatGPT signing key (vendored in the repo — OpenAI publishes no stable key URL)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/chatgpt.asc"
    dest: "{{ keyring_dir }}/chatgpt.asc"
    mode: "0644"

- name: ChatGPT apt repo
  ansible.builtin.deb822_repository:
    name: chatgpt
    types: [deb]
    uris: https://persistent.oaistatic.com/codex-app-prod/linux/deb
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: "{{ keyring_dir }}/chatgpt.asc"

- name: ChatGPT desktop
  ansible.builtin.apt:
    name: chatgpt

- name: Claude Code and Codex installers (vendored — no piping the internet to a shell)
  become: false
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ item }}"
    dest: "{{ user_scratch }}/{{ item }}"
    mode: "0700"
  loop:
    - claude-install.sh
    - codex-install.sh

- name: Claude Code
  become: false
  ansible.builtin.command: "{{ user_scratch }}/claude-install.sh"
  args:
    creates: "{{ home }}/.local/bin/claude"

- name: Codex CLI
  become: false
  ansible.builtin.command: "{{ user_scratch }}/codex-install.sh"
  args:
    creates: "{{ home }}/.local/bin/codex"
